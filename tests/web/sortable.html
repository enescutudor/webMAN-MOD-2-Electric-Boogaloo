<!doctype html>
<!-- Test for jQuery UI sortable, as used by the game list (games_html.h: $("#mg").sortable()).
     Copy it next to jquery.min.js and jquery-ui.min.js and render it with firefox --headless --screenshot.
     The result shows in large letters: PASS or FAIL and the reason. -->
<html>
<head>
<meta charset="utf-8">
<script src="jquery.min.js"></script>
<script src="jquery-ui.min.js"></script>
<style>
	#mg div { width: 200px; height: 40px; margin: 4px; background: #ccc; }
	#res { font: bold 64px sans-serif; }
</style>
</head>
<body>
<div id="mg"><div id="a">A</div><div id="b">B</div><div id="c">C</div></div>
<div id="res">...</div>
<script>
function result(ok, reason) {
	var r = document.getElementById("res");
	r.textContent = (ok ? "PASS " : "FAIL ") + reason;
	r.style.color = ok ? "green" : "red";
}
function mouse(type, el, x, y) {
	var e = document.createEvent("MouseEvents");
	e.initMouseEvent(type, true, true, window, 0, x, y, x, y, false, false, false, false, 0, null);
	el.dispatchEvent(e);
}
try {
	if (!$.fn.sortable) throw new Error("$.fn.sortable is missing");
	$("#mg").sortable();
	if (!$("#mg").hasClass("ui-sortable")) throw new Error("sortable did not initialize");
	// drag A below C
	var a = document.getElementById("a"), c = document.getElementById("c");
	var ra = a.getBoundingClientRect(), rc = c.getBoundingClientRect();
	var x = ra.left + 10, y0 = ra.top + 10, y1 = rc.bottom - 2;
	mouse("mousedown", a, x, y0);
	for (var y = y0; y <= y1; y += 5) mouse("mousemove", document, x, y);
	mouse("mouseup", document, x, y1);
	var order = $("#mg").children().map(function () { return this.id; }).get().join("");
	result(order === "bca", "order " + order + ", jQuery UI " + $.ui.version);
} catch (e) {
	result(false, e.message);
}
</script>
</body>
</html>
